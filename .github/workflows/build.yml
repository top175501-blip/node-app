name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show real error
        if: failure()
        shell: bash
        run: |
          echo "===== XATO QISMI ====="
          grep -n -i -E "error:|ERROR|Traceback|not found|No matching|failed" build.log | grep -v "^[0-9]*:#" | tail -n 25
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
